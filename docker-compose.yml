# ============================================================
# LLM Logger - Docker Compose (默认全栈)
#
# 默认行为: docker compose up -d 启动全部 5 个服务
#   - clickhouse    (主存储, :8123 HTTP / :9000 TCP)
#   - minio         (对象存储, :9100 S3 / :9001 Console)
#   - gateway       (反向代理, :8080)
#   - query-api     (查询 API, 仅内部)
#   - admin-ui      (Web 面板, :${ADMIN_UI_PORT:-8888})
#
# 仅启动基础设施 (开发时本地 go run / uv run):
#   docker compose up -d clickhouse minio
#
# 生产覆盖 (关闭公网端口 / 加密码):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:
  # ============================================================
  # ClickHouse - 主存储
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: llmlog-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ports:
      - "${CH_HTTP_PORT:-8123}:8123"   # HTTP
      - "${CH_TCP_PORT:-9000}:9000"    # Native TCP
      # 9009 内部复制端口, 单节点不用暴露
    environment:
      CLICKHOUSE_DB: "${LLMLOG_CH_DATABASE:-llm_logger}"
      CLICKHOUSE_USER: "${LLMLOG_CH_USER:-default}"
      CLICKHOUSE_PASSWORD: "${LLMLOG_CH_PASSWORD:-}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/config.d:/etc/clickhouse-server/config.d
      - ./deploy/clickhouse/users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      - llmlog

  # ============================================================
  # MinIO - 本地 S3 兼容对象存储 (开发用, 生产替换为腾讯 COS / AWS S3)
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: llmlog-minio
    hostname: minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9100}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: "${LLMLOG_S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${LLMLOG_S3_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmlog

  # ============================================================
  # Gateway (Go) - 反向代理 + 采集
  #
  # newapi 上游连接的三种模式 (LLMLOG_UPSTREAM_URL):
  #   1. [默认] newapi 独立容器, 宿主机端口 3000 已映射:
  #      LLMLOG_UPSTREAM_URL=http://host.docker.internal:3000
  #   2. newapi 在同一 docker network:
  #      - 在 .env 中: LLMLOG_UPSTREAM_URL=http://<newapi-container>:3000
  #      - 并添加 newapi 的 network 到下面 networks 段
  #   3. gateway 共享宿主机网络 (极端场景):
  #      - 取消注释 `network_mode: host`
  #      - LLMLOG_UPSTREAM_URL=http://localhost:3000
  # ============================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: prismai/llm-logger-gateway:latest
    container_name: llmlog-gateway
    hostname: gateway
    restart: unless-stopped
    # network_mode: host   # 方案3: 开启此行并注释下方 ports/networks
    ports:
      - "${GATEWAY_PORT:-8080}:8080"          # Proxy 端口
      - "${GATEWAY_METRICS_PORT:-9090}:9090"  # Metrics
    environment:
      LLMLOG_LISTEN_ADDR: "0.0.0.0:8080"
      LLMLOG_METRICS_ADDR: "0.0.0.0:9090"
      LLMLOG_UPSTREAM_URL: "${LLMLOG_UPSTREAM_URL:-http://host.docker.internal:3000}"
      LLMLOG_UPSTREAM_TIMEOUT: "${LLMLOG_UPSTREAM_TIMEOUT:-600s}"
      LLMLOG_MAX_BODY_BYTES: "${LLMLOG_MAX_BODY_BYTES:-104857600}"
      LLMLOG_COS_OFFLOAD_THRESHOLD: "${LLMLOG_COS_OFFLOAD_THRESHOLD:-32768}"
      LLMLOG_CAPTURE_BUFFER: "${LLMLOG_CAPTURE_BUFFER:-10000}"
      LLMLOG_CAPTURE_WORKERS: "${LLMLOG_CAPTURE_WORKERS:-4}"
      LLMLOG_CH_BATCH_SIZE: "${LLMLOG_CH_BATCH_SIZE:-200}"
      LLMLOG_CH_BATCH_INTERVAL: "${LLMLOG_CH_BATCH_INTERVAL:-500ms}"
      LLMLOG_CH_HOST: clickhouse
      LLMLOG_CH_PORT: "8123"
      LLMLOG_CH_DATABASE: "${LLMLOG_CH_DATABASE:-llm_logger}"
      LLMLOG_CH_USER: "${LLMLOG_CH_USER:-default}"
      LLMLOG_CH_PASSWORD: "${LLMLOG_CH_PASSWORD:-}"
      LLMLOG_S3_ENDPOINT: "http://minio:9000"
      LLMLOG_S3_BUCKET: "${LLMLOG_S3_BUCKET:-llm-logs}"
      LLMLOG_S3_ACCESS_KEY: "${LLMLOG_S3_ACCESS_KEY:-minioadmin}"
      LLMLOG_S3_SECRET_KEY: "${LLMLOG_S3_SECRET_KEY:-minioadmin}"
      LLMLOG_S3_USE_PATH_STYLE: "true"
      LLMLOG_LOG_LEVEL: "${LLMLOG_LOG_LEVEL:-info}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    # gateway 镜像基于 distroless, 无 wget/curl/sh 做 healthcheck
    # liveness 由 `/healthz` HTTP 端点提供, k8s/外层探针直接调即可
    networks:
      - llmlog

  # ============================================================
  # Query API (Python) - 查询服务
  # 默认不直接暴露端口 (由 admin-ui nginx 反代 /api/*)
  # 如需直接访问, 解开 ports 段
  # ============================================================
  query-api:
    build:
      context: ./query-api
      dockerfile: Dockerfile
    image: prismai/llm-logger-query-api:latest
    container_name: llmlog-query-api
    hostname: query-api
    restart: unless-stopped
    # ports:
    #   - "${QUERY_API_PORT:-8000}:8000"
    environment:
      LLMLOG_API_HOST: "0.0.0.0"
      LLMLOG_API_PORT: "8000"
      LLMLOG_CH_HOST: clickhouse
      LLMLOG_CH_PORT: "8123"
      LLMLOG_CH_DATABASE: "${LLMLOG_CH_DATABASE:-llm_logger}"
      LLMLOG_CH_USER: "${LLMLOG_CH_USER:-default}"
      LLMLOG_CH_PASSWORD: "${LLMLOG_CH_PASSWORD:-}"
      LLMLOG_S3_ENDPOINT: "http://minio:9000"
      LLMLOG_S3_BUCKET: "${LLMLOG_S3_BUCKET:-llm-logs}"
      LLMLOG_S3_ACCESS_KEY: "${LLMLOG_S3_ACCESS_KEY:-minioadmin}"
      LLMLOG_S3_SECRET_KEY: "${LLMLOG_S3_SECRET_KEY:-minioadmin}"
      LLMLOG_API_TOKEN: "${LLMLOG_API_TOKEN:-dev-token-change-me}"
      LLMLOG_API_CORS_ORIGINS: "${LLMLOG_API_CORS_ORIGINS:-*}"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - llmlog

  # ============================================================
  # Admin UI (React + Nginx) - Web 查询面板
  # 浏览器访问 http://<server-ip>:${ADMIN_UI_PORT:-8888}
  # ============================================================
  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    image: prismai/llm-logger-admin-ui:latest
    container_name: llmlog-admin-ui
    hostname: admin-ui
    restart: unless-stopped
    ports:
      - "${ADMIN_UI_PORT:-8888}:80"
    environment:
      # 前端 /api 反代目标: 默认同 compose 内 query-api:8000
      LLMLOG_ADMIN_API_BASE: "${LLMLOG_ADMIN_API_BASE:-/api}"
    depends_on:
      - query-api
    networks:
      - llmlog

# ============================================================
volumes:
  clickhouse_data:
  clickhouse_logs:
  minio_data:

networks:
  llmlog:
    driver: bridge
