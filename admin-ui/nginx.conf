## ============================================================
## LLM Logger Admin UI - Nginx 配置
## 反代 /api/* 到 query-api:8000, 其他路径 SPA fallback 到 index.html
## ============================================================

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 静态资源压缩
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

  # 静态资源长缓存 (hashed 文件名)
  location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # /api/* 反代到 query-api (容器内部 hostname)
  # 通过环境变量 QUERY_API_UPSTREAM 在 entrypoint 中注入
  location /api/ {
    proxy_pass http://query-api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  # 健康检查端点反代到 query-api (TokenGate 验证 token 需要)
  location = /readyz {
    proxy_pass http://query-api:8000/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  location = /healthz {
    proxy_pass http://query-api:8000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  # nginx 自身健康检查
  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # SPA 路由: 未匹配路径全部回退到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 禁止访问隐藏文件
  location ~ /\. {
    deny all;
    return 404;
  }
}
